[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lorenzda"
version = "1.0.0"
description = "Data Assimilation Framework for Lorenz Models"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0"}
authors = [
    {name = "Rahul Mahajan", email = "rahul.mahajan@nasa.gov"}
]
keywords = ["data-assimilation", "ensemble", "variational", "lorenz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.16.0",
    "scipy>=1.2.0",
    "matplotlib>=3.0.0",
    "netCDF4>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10.0",
    "black>=20.8b1",
    "flake8>=3.8.0",
]

[project.scripts]
lorenzda = "lorenzda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lorenzda*"]

[tool.black]
line-length = 99
target-version = ['py37', 'py38', 'py39', 'py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lorenzda"
