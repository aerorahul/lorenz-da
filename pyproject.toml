[project]
name = "lorenzda"
description = "Data Assimilation Framework for Lorenz Models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "Rahul Mahajan", email = "aerorahul@noreply.github.com"}
]
keywords = ["data-assimilation", "ensemble", "variational", "lorenz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.16.0",
    "scipy>=1.2.0",
    "matplotlib>=3.0.0",
    "netCDF4>=1.4.0",
    "pyyaml>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10.0",
    "black>=20.8b1",
    "flake8>=3.8.0",
    "pre-commit>=4.3.0",
]

[project.scripts]
lorenzda = "lorenzda.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lorenzda*"]

[tool.black]
line-length = 99
target-version = ['py311', 'py312', 'py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lorenzda"

[tool.setuptools_scm]
write_to = "lorenzda/_version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
parentdir_prefix_version='lorenzda-'  # get version from GitHub-like tarballs
fallback_version='v0.0.1'