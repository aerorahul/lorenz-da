# L96 Ensemble DA Parameters
# Lorenz 96 model configuration for EnKF/EnSRF/EAKF

model:
  name: L96
  ndof: 40
  parameters: [8.0, 8.4]
  dt: 0.0001
  random_seed: 0

da:
  nassim: 1000
  ntimes: 0.05
  t0: 0.0

# Model error covariance
q: null

# Observation operator
h: null

# Observation error covariance
r: null

# Ensemble DA configuration
ensemble:
  update: 2  # 0=No Assim, 1=EnKF, 2=EnSRF, 3=EAKF
  nens: 20  # number of ensemble members
  init_ens_infl_fac: 1.0
  inflation:
    inflate: 1  # 0=None, 1=Multiplicative, 2=Additive, 3=CovRelax, 4=SpreadRestoration
    infl_fac: 1.06
  localization:
    localize: 1  # 0=None, 1=Gaspari-Cohn, 2=Boxcar, 3=Ramped
    cov_cutoff: 0.0625
    cov_trunc: 40

# Output file configuration
output:
  filename: L96_ensDA_diag.nc4
  attributes:
    model: L96
    F: 8.0
    dF: 0.4
    dt: 0.0001
    ntimes: 0.05
    update: 2
    localization: 1
    cov_cutoff: 0.0625
    cov_trunc: 40
    inflation: 1
    infl_fac: 1.06

# Restart conditions
restart:
  time: null
  filename: ""
