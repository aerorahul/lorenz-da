# L96 Hybrid DA Parameters
# Lorenz 96 model configuration for hybrid ensemble-variational DA

model:
  name: L96
  ndof: 40
  parameters: [8.0, 8.4]
  dt: 0.0001
  random_seed: 0

da:
  nassim: 1000
  ntimes: 0.1  # 2*0.05
  t0: 0.0
  maxouter: 1
  do_hybrid: true
  hybrid_weight: 1.0  # 0=static, 1=ensemble
  hybrid_recenter: true

# Model error covariance
q: null

# Observation operator
h: null

# Observation error covariance
r: null

# Ensemble configuration
ensemble:
  update: 2  # 0=No Assim, 1=EnKF, 2=EnSRF, 3=EAKF
  nens: 20
  init_ens_infl_fac: 1.0
  inflation:
    inflate: 1  # 0=None, 1=Multiplicative, 2=Additive, 3=CovRelax, 4=SpreadRestoration
    infl_fac: 1.06
  localization:
    localize: 1  # 0=None, 1=Gaspari-Cohn, 2=Boxcar, 3=Ramped
    cov_cutoff: 0.0625
    cov_trunc: 40

# Variational configuration
variational:
  update: 2  # 1=3DVar, 2=4DVar
  precondition: 1  # 0=None, 1=sqrtB, 2=FullB
  minimization:
    maxiter: 100
    tolerance: 0.0001
  inflation:
    inflate: true
    infl_fac: 1.85
    infl_adp: true  # adaptive inflation
  localization:
    localize: 1  # 0=None, 1=Gaspari-Cohn, 2=Boxcar, 3=Ramped
    cov_cutoff: 0.0625
    cov_trunc: 40
  fv4d:
    window: 0.75
    offset: 0.25
    nobstimes: 4

# Output file configuration
output:
  filename: L96_hybDA_diag.nc4
  attributes:
    model: L96
    F: 8.0
    dF: 0.4
    dt: 0.0001
    ntimes: 0.1
    do_hybrid: 1
    hybrid_weight: 1.0
    hybrid_recenter: 1

# Restart conditions
restart:
  time: null
  filename: ""
